name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper Files
        run: |
          cd First--main
          gradle wrapper
          chmod +x gradlew

      - name: Commit Wrapper Files to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add First--main/gradlew First--main/gradle/wrapper/gradle-wrapper.jar
          git commit -m "Add official gradlew and gradle-wrapper.jar" || echo "No changes to commit"
          git push
